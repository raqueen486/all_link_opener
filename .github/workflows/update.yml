name: Auto Scrape NPay Links

on:
  schedule:
    # 한국 시간 매일 00:30, 07:30, 12:30, 18:30 (하루 4번 자동 업데이트)
    - cron: '30 15,22,3,9 * * *'
  workflow_dispatch: # 내가 원할 때 수동으로 즉시 실행하는 버튼 활성화

permissions:
  contents: write # 수집한 json 파일을 저장소에 자동 저장할 권한 부여

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 불러오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필수 패키지 설치 및 수집 실행
        run: |
          pip install requests beautifulsoup4
          python scraper.py

      - name: 수집된 링크 JSON 자동 저장
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add daily_links.json
          git diff --staged --quiet || git commit -m "Update daily_links.json"
          git push
