<!DOCTYPE html>
<html lang="ko">
<head>
<!-- 브라우저 파비콘 및 홈 화면 바로가기 아이콘 등록 -->
<link rel="icon" type="image/png" href="./icon.png">
<link rel="apple-touch-icon" href="./icon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>링크 한번에 열기</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; box-sizing: border-box; }
    h2 { font-size: 20px; margin-bottom: 12px; color: #1f2937; }
    textarea { width: 100%; height: 220px; padding: 12px; box-sizing: border-box; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; resize: vertical; }
    button { width: 100%; margin-top: 12px; padding: 14px; font-size: 16px; font-weight: bold; color: #fff; background: #2563eb; border: 0; border-radius: 8px; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .notice { margin-top: 12px; font-size: 13px; color: #6b7280; line-height: 1.5; }
  </style>
</head>
<body>
  <h2>🔗 링크 한번에 열기</h2>
  <textarea id="links" placeholder="여기에 링크를 한 줄에 하나씩 입력하세요.&#10;https://www.naver.com&#10;https://www.google.com"></textarea>
  <button onclick="openLinks()">링크 한번에 열기</button>
  <p class="notice">※ 링크가 하나만 열릴 경우, 브라우저 주소창 우측의 <b>'팝업 차단'</b> 아이콘을 눌러 <b>'항상 허용'</b>으로 변경해 주세요.</p>

  <script>
    function openLinks() {
      const urls = document.getElementById('links').value
        .split(/\n+/)
        .map(url => url.trim())
        .filter(url => /^https?:\/\//i.test(url));

      if (urls.length === 0) {
        alert('http:// 또는 https:// 로 시작하는 링크를 입력하세요.');
        return;
      }

      urls.forEach(url => window.open(url, '_blank', 'noopener'));
    }

    // 페이지가 열릴 때 주소창(?links=...)에 전달된 링크가 있으면 자동으로 입력칸에 채워넣기
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const sharedLinks = params.get('links');
      
      if (sharedLinks) {
        const textarea = document.getElementById('links');
        if (textarea) {
          textarea.value = sharedLinks;
        }
        // 주소창의 긴 ?links=... 꼬리표를 깔끔하게 지우기
        window.history.replaceState({}, document.title, window.location.pathname);
      }
    });
  </script>
</body>
</html>
