<!DOCTYPE html>
<html lang="ko">
<head>
<link rel="icon" type="image/png" href="./icon.png">
<link rel="apple-touch-icon" href="./icon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>링크 한번에 열기</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; box-sizing: border-box; transition: font-size 0.2s; }
    
    /* 기본 모드 */
    h2 { font-size: 20px; margin-bottom: 6px; color: #1f2937; }
    .status { font-size: 13px; color: #059669; margin-bottom: 12px; font-weight: 600; }
    textarea { width: 100%; height: 240px; padding: 12px; box-sizing: border-box; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; resize: vertical; }
    button { width: 100%; margin-top: 12px; padding: 14px; font-size: 16px; font-weight: bold; color: #fff; background: #2563eb; border: 0; border-radius: 8px; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .btn-sub { background: #4b5563; margin-top: 8px; padding: 10px; font-size: 14px; }
    .btn-sub:hover { background: #374151; }
    .notice { margin-top: 12px; font-size: 13px; color: #6b7280; line-height: 1.5; }

    /* 큰 글씨 모드 (시니어 선배님용) */
    body.large-text h2 { font-size: 26px; }
    body.large-text .status { font-size: 16px; }
    body.large-text textarea { font-size: 18px; height: 300px; }
    body.large-text button { font-size: 20px; padding: 18px; }
    body.large-text .btn-sub { font-size: 16px; padding: 14px; }
    body.large-text .notice { font-size: 16px; }
  </style>
</head>
<body>
  <h2>🔗 링크 한번에 열기</h2>
  <div id="status" class="status">⏳ 오늘자 네이버페이 링크를 불러오는 중...</div>
  
  <textarea id="links" placeholder="여기에 링크를 한 줄에 하나씩 입력하세요."></textarea>
  
  <button id="openBtn" onclick="openLinks()">링크 한번에 열기</button>
  <button class="btn-sub" onclick="toggleLargeText()" id="fontToggleBtn">🔍 큰 글씨로 보기 (시니어 모드)</button>
  <button class="btn-sub" onclick="loadDailyLinks()">🔄 오늘자 네페 링크 다시 불러오기</button>
  
  <p class="notice">※ 링크가 하나만 열릴 경우, 브라우저 주소창 우측의 <b>'팝업 차단'</b> 아이콘을 눌러 <b>'항상 허용'</b>으로 변경해 주세요.</p>

  <script>
    function updateButtonCount() {
      const urls = document.getElementById('links').value
        .split(/\n+/)
        .map(u => u.trim())
        .filter(u => /^https?:\/\//i.test(u));
      document.getElementById('openBtn').textContent = `링크 한번에 열기 (총 ${urls.length}개)`;
    }

    document.getElementById('links').addEventListener('input', updateButtonCount);

    function openLinks() {
      const urls = document.getElementById('links').value
        .split(/\n+/)
        .map(url => url.trim())
        .filter(url => /^https?:\/\//i.test(url));

      if (urls.length === 0) {
        alert('http:// 또는 https:// 로 시작하는 링크를 입력하세요.');
        return;
      }
      urls.forEach(url => window.open(url, '_blank', 'noopener'));
    }

    // 큰 글씨 모드 토글 함수
    function toggleLargeText() {
      const body = document.body;
      const btn = document.getElementById('fontToggleBtn');
      body.classList.toggle('large-text');
      
      if (body.classList.contains('large-text')) {
        btn.textContent = ' 기본 글씨로 보기';
        localStorage.setItem('largeTextMode', 'on');
      } else {
        btn.textContent = '🔍 큰 글씨로 보기 (시니어 모드)';
        localStorage.setItem('largeTextMode', 'off');
      }
    }

    // 페이지 로드 시 이전에 설정했던 글씨 크기 모드 복원
    window.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('largeTextMode') === 'on') {
        document.body.classList.add('large-text');
        document.getElementById('fontToggleBtn').textContent = ' 기본 글씨로 보기';
      }
    });

    async function loadDailyLinks() {
      const statusEl = document.getElementById('status');
      const textarea = document.getElementById('links');
      try {
        const res = await fetch('./daily_links.json?t=' + Date.now());
        if (!res.ok) throw new Error('아직 생성된 링크 파일이 없습니다.');
        const data = await res.json();
        textarea.value = data.links.join('\n');
        statusEl.textContent = `✅ 자동 수집 완료 (업데이트: ${data.updated_at} / 신규 ${data.dynamic_count}개 + 고정 6개)`;
        updateButtonCount();
      } catch (e) {
        statusEl.textContent = 'ℹ️ 자동 수집 대기 중 (GitHub Actions에서 첫 실행을 해주세요)';
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const sharedLinks = params.get('links');
      if (sharedLinks) {
        document.getElementById('links').value = sharedLinks;
        document.getElementById('status').textContent = '✅ 북마크릿으로 전달된 링크가 입력되었습니다.';
        updateButtonCount();
        window.history.replaceState({}, document.title, window.location.pathname);
      } else {
        loadDailyLinks();
      }
    });
  </script>
</body>
</html>
